[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-claims-anomaly-mlops"
version = "0.1.0"
description = "Interview-ready CMS DE-SynPUF ETL, SQL feature engineering, ML, MLflow, Docker, and CI project"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
