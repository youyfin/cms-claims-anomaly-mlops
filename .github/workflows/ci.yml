name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint                               # Lint the code using ruff. This will check for syntax errors, formatting issues, and other style violations.
        run: ruff check src scripts tests
      - name: Unit tests                         # Run the unit tests using pytest. This will run the tests and report the results.
        run: pytest -q
      - name: Smoke test end-to-end pipeline     # Run the end-to-end pipeline to smoke test the application. This will generate some demo data and run the pipeline.
        run: |
          python scripts/generate_demo_data.py --rows 3000
          python scripts/run_pipeline.py --disable-mlflow
