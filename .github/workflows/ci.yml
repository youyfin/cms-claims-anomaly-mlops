name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src scripts tests
      - name: Unit tests
        run: pytest -q
      - name: Smoke test end-to-end pipeline
        run: |
          python scripts/generate_demo_data.py --rows 3000
          python scripts/run_pipeline.py --disable-mlflow
